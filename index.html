<style>
  :root {
    --blue: #1c3bd3;
    --white: #ffffff;
    --white-70: rgba(255, 255, 255, 0.7);
    --white-50: rgba(255, 255, 255, 0.5);
    --white-20: rgba(255, 255, 255, 0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--blue);
    color: var(--white);
    font-family: 'Outfit', system-ui, sans-serif;
    font-weight: 300;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.5rem 3rem;
  }
  .logo {
    width: min(340px, 72vw);
    height: auto;
    display: block;
    margin: 0 auto 1.8rem;
  }
  .entry {
    max-width: 34rem;
    margin: 0 auto;
  }
  .wordclass {
    margin-top: 0;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--white-50);
  }
  .rule {
    width: 3rem;
    height: 1px;
    background: var(--white-20);
    border: 0;
    margin: 2.4rem auto;
  }
  .etym {
    font-size: 1.02rem;
    line-height: 1.85;
    color: var(--white-70);
  }
  .etym i { color: var(--white); font-style: italic; }
  .meaning {
    margin-top: 2.2rem;
    font-size: clamp(1.25rem, 3.4vw, 1.55rem);
    font-weight: 400;
    line-height: 1.5;
    color: var(--white);
  }
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem 3rem;
  }
  footer .company {
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--white-50);
    margin-bottom: 0.7rem;
  }
  footer a {
    color: var(--white);
    font-size: 1.05rem;
    font-weight: 400;
    text-decoration: none;
    border-bottom: 1px solid var(--white-20);
    padding-bottom: 2px;
    transition: border-color 0.25s ease;
  }
  footer a:hover, footer a:focus-visible { border-color: var(--white); }
  footer a:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; border-radius: 2px; }
  .fade { opacity: 0; transform: translateY(14px); animation: rise 0.9s ease forwards; }
  .d1 { animation-delay: 0.1s; }
  .d2 { animation-delay: 0.3s; }
  .d3 { animation-delay: 0.5s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>

    <p class="wordclass">Substantiv &middot; Latin</p>
    <hr class="rule">
    <p class="etym">Av <i>efficere</i>: å utføre, å oppnå, å gjøre noe effektivt. Endelsen <i>-tas</i> uttrykker en egenskap eller tilstand, slik som i <i>veritas</i> (sannhet) og <i>libertas</i> (frihet).</p>
    <p class="meaning">Evnen til å få ting gjort på en effektiv måte.</p>
